repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff-fix
        entry: pdm run ruff check --select I --fix .
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: pdm run ruff format .
        language: system
        types: [python]
